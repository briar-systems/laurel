name: CI

on:
  pull_request:
  # cd.yml runs the full tier through this, since a tag has no base branch
  workflow_call:
    inputs:
      heavy:
        type: string
        default: none
  workflow_dispatch:
    inputs:
      heavy:
        description: heavy work to run on this ref
        type: choice
        default: none
        options: [none, all, aarch64-linux, x86_64-windows, aarch64-darwin, x86_64-darwin]

permissions:
  contents: read

jobs:
  lib:
    uses: briar-systems/.github/.github/workflows/mach-lib.yml@main
    with:
      heavy: ${{ inputs.heavy }}
      # std 9 needs mach 6, so this seeds v6.0.0 until the family pin moves
      mach-version: v6.0.0
      # crypto links std's start code that requires PSTATE.DIT on aarch64
      dit: required
      # demo/ and doc/bench/laurel/ build this working tree through hedge, which
      # still selects std 8 and mach 5. they return as subprojects once hedge
      # moves to mach 6

  gate:
    if: always()
    needs: [lib]
    runs-on: ubuntu-latest
    steps:
      - uses: briar-systems/.github/.github/actions/gate@main
        with:
          needs: ${{ toJSON(needs) }}
