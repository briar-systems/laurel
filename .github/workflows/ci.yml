name: CI

on:
  pull_request:
  # cd.yml runs the full tier through this, since a tag has no base branch
  workflow_call:
    inputs:
      heavy:
        type: string
        default: none
  workflow_dispatch:
    inputs:
      heavy:
        description: heavy work to run on this ref
        type: choice
        default: none
        options: [none, all, aarch64-linux, x86_64-windows, aarch64-darwin, x86_64-darwin]

permissions:
  contents: read

jobs:
  lib:
    uses: briar-systems/.github/.github/workflows/mach-lib.yml@main
    with:
      heavy: ${{ inputs.heavy }}
      # std 9 needs mach 6, ahead of the family pin
      mach-version: v6.2.1
      # crypto links std's start code that requires PSTATE.DIT on aarch64
      dit: required
      # the demo and the bench server build this working tree through a path
      # dependency, once, on the primary leg, and pull the gitlinks committed
      # under their dep/. the demo also runs its in-process test
      subprojects: >-
        [{"path": "demo", "build": true, "test": true, "legs": ["x86_64-linux"]},
         {"path": "doc/bench/laurel", "build": true, "test": false, "legs": ["x86_64-linux"]}]

  gate:
    if: always()
    needs: [lib]
    runs-on: ubuntu-latest
    steps:
      - uses: briar-systems/.github/.github/actions/gate@main
        with:
          needs: ${{ toJSON(needs) }}
