[project]
id = "demo"
version = "0.1.0"
src = "src"
out = "out/{target.name}/{profile.name}"

[target.linux-x86_64]
default = true
isa = "x86_64"
os = "linux"
abi = "sysv64"

[target.linux-arm64]
isa = "aarch64"
os = "linux"
abi = "aapcs64"

[target.darwin-aarch64]
isa = "aarch64"
os = "darwin"
abi = "aapcs64"

[profile.debug]
default = true
opt = 0
debug = false
simd = "scalarize"
vectorize = true
float_reassoc = false

[profile.release]
opt = 2
debug = false
simd = "scalarize"
vectorize = true
float_reassoc = false

[artifact.laurel-demo]
kind = "bin"
entry = "bin/main.mach"
out = "bin/laurel-demo"
targets = ["*"]
link = []
need = []

[dep.std]
git = "https://github.com/briar-systems/mach-std"
ref = "tag/v2.0.0"

[dep.laurel]
git = "https://github.com/briar-systems/laurel"
ref = "tag/v0.9.0"

[dep.hedge]
git = "https://github.com/briar-systems/hedge"
ref = "tag/v0.3.0"

[dep.http]
git = "https://github.com/briar-systems/mach-http"
ref = "tag/v0.8.0"
