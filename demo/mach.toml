[project]
id = "demo"
mach = "^5.12"
version = "0.1.0"
src = "src"
out = "out/{target.name}/{profile.name}"

[target.linux-x86_64]
default = true
isa = "x86_64"
os = "linux"
abi = "sysv64"

[target.linux-arm64]
isa = "aarch64"
os = "linux"
abi = "aapcs64"

[target.darwin-aarch64]
isa = "aarch64"
os = "darwin"
abi = "aapcs64"

[profile.debug]
default = true
opt = 0
debug = false
simd = "scalarize"
vectorize = true
float_reassoc = false

[profile.release]
opt = 2
debug = false
simd = "scalarize"
vectorize = true
float_reassoc = false

[artifact.laurel-demo]
kind = "bin"
entry = "bin/main.mach"
out = "bin/laurel-demo"
targets = ["*"]
link = []
need = []

# std is declared by ref so the root's selection overrides hedge's exact
# `=8.0.0`. mach resolves one std for the whole build.
[dep.std]
git = "https://github.com/briar-systems/mach-std"
ref = "tag/v8.1.0"

# the laurel this demo lives in, so the demo builds against the working tree.
# the path overrides the laurel release hedge itself selects.
[dep.laurel]
path = "../"

[dep.hedge]
git = "https://github.com/briar-systems/hedge"
ref = "commit/3c0325522eb60a1405bfb41d8dcc8cd4d4b882c3"

[dep.http]
git = "https://github.com/briar-systems/mach-http"
ref = "tag/v0.19.0"
