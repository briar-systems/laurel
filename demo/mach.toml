[project]
id = "standalone"
mach = "^7"
version = "0.1.0"
src = "src"
work = "out/{target.name}/{profile.name}"

[target.linux-x86_64]
arch = "x86_64"
sys = "linux"
abi = "sysv64"

[target.linux-arm64]
arch = "aarch64"
sys = "linux"
abi = "aapcs64"

[target.darwin-aarch64]
arch = "aarch64"
sys = "darwin"
abi = "darwinpcs"

[profile.debug]
default = true
optimize = false
debug = false
simd = "scalarize"

[profile.release]
optimize = true
debug = false
simd = "scalarize"

[artifact.laurel-standalone]
kind = "bin"
entry = "bin/main.mach"
out = "{project.work}/bin/laurel-standalone{artifact.suffix}"
targets = ["*"]
link = []
need = []

[dep.std]
git = "https://github.com/briar-systems/mach-std"
version = "^10.0.0"

# the laurel this example lives in, so it builds against the working tree
[dep.laurel]
path = "../"

[dep.http]
git = "https://github.com/briar-systems/mach-http"
version = "^0.26.0"
