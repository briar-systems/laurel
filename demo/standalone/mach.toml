[project]
id = "standalone"
mach = "^6"
version = "0.1.0"
src = "src"
out = "out/{target.name}/{profile.name}"

[target.linux-x86_64]
default = true
isa = "x86_64"
os = "linux"
abi = "sysv64"

[target.linux-arm64]
isa = "aarch64"
os = "linux"
abi = "aapcs64"

[target.darwin-aarch64]
isa = "aarch64"
os = "darwin"
abi = "aapcs64"

[profile.debug]
default = true
opt = 0
debug = false
simd = "scalarize"
vectorize = true
float_reassoc = false

[profile.release]
opt = 2
debug = false
simd = "scalarize"
vectorize = true
float_reassoc = false

[artifact.laurel-standalone]
kind = "bin"
entry = "bin/main.mach"
out = "bin/laurel-standalone"
targets = ["*"]
link = []
need = []

[dep.std]
git = "https://github.com/briar-systems/mach-std"
version = "^9.0"

# the laurel this example lives in, so it builds against the working tree
[dep.laurel]
path = "../../"

[dep.http]
git = "https://github.com/briar-systems/mach-http"
version = "^0.23"
