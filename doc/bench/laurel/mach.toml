[project]
id = "bench"
version = "0.1.0"
src = "src"
out = "out/{target.name}/{profile.name}"

[target.linux-x86_64]
isa = "x86_64"
os = "linux"
abi = "sysv64"

[target.linux-arm64]
isa = "aarch64"
os = "linux"
abi = "aapcs64"

[target.darwin-aarch64]
isa = "aarch64"
os = "darwin"
abi = "aapcs64"

[profile.debug]
opt = 0
# the demo links hedge's whole serving runtime; debug info pushes the link
# past what a 32 GiB machine can hold, so this profile stays lean
debug = false
simd = "scalarize"

[profile.release]
opt = 2
debug = false
simd = "scalarize"

[artifact.laurel-bench]
kind = "bin"
entry = "bin/main.mach"
out = "bin/laurel-bench"
targets = ["*"]
link = []
need = []

[dep.mach-std]
git = "https://github.com/briar-systems/mach-std"
ref = "tag/v0.34.0"

[dep.mach-http]
git = "https://github.com/briar-systems/mach-http"
ref = "tag/v0.7.6"

[dep.mach-crypto]
git = "https://github.com/briar-systems/mach-crypto"
ref = "tag/v0.8.2"

[dep.mach-tls]
git = "https://github.com/briar-systems/mach-tls"
ref = "tag/v0.2.5"

[dep.mach-quic]
git = "https://github.com/briar-systems/mach-quic"
ref = "tag/v0.5.9"

[dep.mach-acme]
git = "https://github.com/briar-systems/mach-acme"
ref = "tag/v0.1.9"

[dep.laurel]
git = "https://github.com/briar-systems/laurel"
ref = "tag/v0.8.9"

[dep.hedge]
git = "https://github.com/briar-systems/hedge"
ref = "tag/v0.2.1"
