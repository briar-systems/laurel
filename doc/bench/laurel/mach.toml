[project]
id = "bench"
mach = "^7"
version = "0.1.0"
src = "src"
work = "out/{target.name}/{profile.name}"

[target.linux-x86_64]
arch = "x86_64"
sys = "linux"
abi = "sysv64"

[target.linux-arm64]
arch = "aarch64"
sys = "linux"
abi = "aapcs64"

[target.darwin-aarch64]
arch = "aarch64"
sys = "darwin"
abi = "darwinpcs"

[profile.debug]
default = true
optimize = false
debug = false
simd = "scalarize"

[profile.release]
optimize = true
debug = false
simd = "scalarize"

[artifact.laurel-bench]
kind = "bin"
entry = "bin/main.mach"
out = "{project.work}/bin/laurel-bench{artifact.suffix}"
targets = ["*"]
link = []
need = []

[dep.std]
git = "https://github.com/briar-systems/mach-std"
ref = "branch/dev"

# the laurel this benchmark lives in, so it measures the working tree
[dep.laurel]
path = "../../../"

[dep.http]
git = "https://github.com/briar-systems/mach-http"
ref = "branch/dev"
