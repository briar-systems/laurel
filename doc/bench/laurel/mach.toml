[project]
id = "bench"
mach = "^6"
version = "0.1.0"
src = "src"
out = "out/{target.name}/{profile.name}"

[target.linux-x86_64]
default = true
isa = "x86_64"
os = "linux"
abi = "sysv64"

[target.linux-arm64]
isa = "aarch64"
os = "linux"
abi = "aapcs64"

[target.darwin-aarch64]
isa = "aarch64"
os = "darwin"
abi = "aapcs64"

[profile.debug]
default = true
opt = 0
debug = false
simd = "scalarize"
vectorize = true
float_reassoc = false

[profile.release]
opt = 2
debug = false
simd = "scalarize"
vectorize = true
float_reassoc = false

[artifact.laurel-bench]
kind = "bin"
entry = "bin/main.mach"
out = "bin/laurel-bench"
targets = ["*"]
link = []
need = []

# std and http are imported directly. mach resolves one of each for the whole
# build, so these ranges admit the exact releases hedge selects.
[dep.std]
git = "https://github.com/briar-systems/mach-std"
version = "^9.0"

# the laurel this benchmark lives in, so it measures the working tree. the path
# overrides the laurel release hedge itself selects.
[dep.laurel]
path = "../../../"

[dep.hedge]
git = "https://github.com/briar-systems/hedge"
version = "=0.12.0"

# laurel needs http 0.23 for laurel.serve, and hedge 0.12.0 pins =0.21.0.
# http 0.22 and 0.23 add the server runner, which hedge does not use, and fix
# the h1 engine compatibly, so the root overrides hedge's pin until this
# hedge-hosted build moves to graft
[dep.http]
git = "https://github.com/briar-systems/mach-http"
ref = "tag/v0.23.0"
