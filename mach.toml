[project]
id = "laurel"
mach = "^7"
version = "0.23.0"
src = "src"
work = "out/{target.name}/{profile.name}"

[target.linux-x86_64]
arch = "x86_64"
sys = "linux"
abi = "sysv64"

[target.linux-arm64]
arch = "aarch64"
sys = "linux"
abi = "aapcs64"

[target.linux-riscv64]
arch = "riscv64"
sys = "linux"
abi = "lp64d"

[target.darwin-x86_64]
arch = "x86_64"
sys = "darwin"
abi = "sysv64"

[target.darwin-aarch64]
arch = "aarch64"
sys = "darwin"
abi = "darwinpcs"

[target.windows-x86_64]
arch = "x86_64"
sys = "windows"
abi = "win64"

[profile.debug]
default = true
optimize = false
debug = false
simd = "scalarize"

[profile.release]
optimize = true
debug = false
simd = "scalarize"

[artifact.laurel]
kind = "static"
entry = "lib/laurel.mach"
out = "{project.work}/lib/laurel{artifact.suffix}"
targets = ["*"]
link = []
need = []

[dep.std]
git = "https://github.com/briar-systems/mach-std"
ref = "branch/dev"

[dep.crypto]
git = "https://github.com/briar-systems/mach-crypto"
ref = "branch/dev"

[dep.http]
git = "https://github.com/briar-systems/mach-http"
ref = "branch/dev"

[dep.encoding]
git = "https://github.com/briar-systems/mach-encoding"
ref = "branch/dev"
